<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwissKnife Web Desktop</title>
    
    <!-- Stlite CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build/stlite.css">
    
    <style>
        /* Unified splash screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .loading-content {
            text-align: center;
            color: white;
            max-width: 500px;
        }
        
        .loading-logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .loading-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #4fc3f7, #29b6f6, #0288d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .loading-subtitle {
            font-size: 16px;
            color: #b0bec5;
            margin-bottom: 30px;
        }
        
        .loading-progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #4fc3f7, #29b6f6);
            width: 0%;
            animation: loadProgress 3s ease-in-out infinite;
        }
        
        @keyframes loadProgress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        /* Basic reset and layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f6;
            overflow: hidden;
        }
        
        #desktop {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: none; /* Hidden until app loads */
        }
    </style>
</head>
<body>
    <!-- Unified Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">🇨🇭</div>
            <div class="loading-title">SwissKnife Web Desktop</div>
            <div class="loading-subtitle">Unified AI-powered development environment</div>
            <div class="loading-progress">
                <div class="loading-bar"></div>
            </div>
        </div>
    </div>

    <!-- Desktop Environment (populated by TypeScript) -->
    <div id="desktop" class="desktop">
        <!-- Desktop content will be generated by the unified app -->
    </div>
</body>
</html>
