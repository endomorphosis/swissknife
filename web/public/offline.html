<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'">
  <title>SwissKnife — Offline</title>
  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      color: #e6e9f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .offline-card {
      max-width: 32rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { line-height: 1.5; color: #9aa4b9; }
    button {
      margin-top: 1.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      border: 1px solid #3a4258;
      background: #161c2c;
      color: #e6e9f2;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #1f2740; }
  </style>
</head>
<body>
  <div class="offline-card">
    <h1>You're offline</h1>
    <p>
      SwissKnife Web Desktop could not reach the network and this page has
      not been cached yet. Previously visited screens and IPFS-backed content
      already cached by the service worker remain available; reconnect to
      load anything new.
    </p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
