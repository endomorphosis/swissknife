name: Multi-Architecture Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  NODE_ENV: production
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and test on multiple architectures
  build-and-test:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 builds
          - os: ubuntu-latest
            arch: x86_64
            node-version: '20.19.0'
            platform: linux/amd64
          - os: ubuntu-latest
            arch: x86_64
            node-version: '22.12.0'
            platform: linux/amd64
          # ARM64 builds (experimental - emulation has limitations)
          - os: ubuntu-latest
            arch: arm64
            node-version: '20.19.0'
            platform: linux/arm64
            experimental: true
          - os: ubuntu-latest
            arch: arm64
            node-version: '22.12.0'
            platform: linux/arm64
            experimental: true
          # macOS builds (x86_64 and ARM64)
          - os: macos-13
            arch: x86_64
            node-version: '20.19.0'
            platform: darwin/amd64
          - os: macos-14
            arch: arm64
            node-version: '20.19.0'
            platform: darwin/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform builds)
        if: matrix.arch == 'arm64' && runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Node.js ${{ matrix.node-version }}
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
        continue-on-error: ${{ matrix.experimental || false }}

      - name: Verify browser-validation toolchain
        if: steps.setup-node.outcome == 'success'
        run: node scripts/verify-browser-toolchain.mjs --receipt "${{ runner.temp }}/swissknife-browser-toolchain-multiarch-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.node-version }}.json"

      - name: Display system information
        if: steps.setup-node.outcome == 'success'
        run: |
          echo "OS: $(uname -s)"
          echo "Architecture: $(uname -m)"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Platform: ${{ matrix.platform }}"

      - name: Install dependencies
        if: steps.setup-node.outcome == 'success'
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Verify package.json
        if: steps.setup-node.outcome == 'success'
        run: |
          echo "Validating package.json..."
          node -e "console.log('✅ package.json is valid:', JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name)"

      - name: Check for platform-specific vulnerabilities
        if: steps.setup-node.outcome == 'success'
        run: |
          echo "Checking for vulnerabilities on ${{ matrix.platform }}..."
          npm audit --audit-level=high || echo "⚠️ Vulnerabilities found (non-blocking)"
        continue-on-error: true

      - name: TypeScript type checking
        if: steps.setup-node.outcome == 'success'
        run: |
          echo "Running TypeScript type checking..."
          npm run typecheck || echo "⚠️ Type check issues found (non-blocking)"
        continue-on-error: true

      - name: Build all components
        if: steps.setup-node.outcome == 'success'
        id: build
        run: |
          echo "Building SwissKnife for ${{ matrix.platform }}..."
          npm run build:all 2>&1 | tee build-output.log
          if [ $? -eq 0 ]; then
            echo "✅ Build successful on ${{ matrix.platform }}"
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Build failed on ${{ matrix.platform }}"
            echo "build_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify build artifacts
        if: steps.setup-node.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          echo "Verifying build artifacts for ${{ matrix.platform }}..."
          
          if [ ! -f "cli.mjs" ]; then
            echo "❌ cli.mjs not found"
            exit 1
          fi
          
          cli_size=$(stat -c%s "cli.mjs" 2>/dev/null || stat -f%z "cli.mjs")
          echo "✅ cli.mjs: ${cli_size} bytes"
          
          if [ $cli_size -lt 1000 ]; then
            echo "❌ cli.mjs appears too small"
            exit 1
          fi
          
          if [ -d "dist" ]; then
            dist_files=$(find dist -type f -name "*.js" | wc -l | tr -d ' ')
            echo "✅ dist directory: $dist_files JavaScript files"
          else
            echo "⚠️ dist directory not found"
          fi
          
          echo "✅ Build artifacts verified for ${{ matrix.platform }}"

      - name: Test CLI functionality
        if: steps.setup-node.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          echo "Testing CLI on ${{ matrix.platform }}..."
          chmod +x cli.mjs
          
          echo "Testing --version..."
          ./cli.mjs --version || (echo "❌ --version failed" && exit 1)
          
          echo "Testing --help..."
          ./cli.mjs --help || (echo "❌ --help failed" && exit 1)
          
          echo "✅ CLI tests passed on ${{ matrix.platform }}"

      - name: Run unit tests (safe subset)
        if: matrix.node-version == '20.19.0' && steps.setup-node.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          echo "Running tests on ${{ matrix.platform }}..."
          npm run test:working 2>&1 | tee test-output.log || echo "⚠️ Some tests failed (non-blocking)"
        continue-on-error: true
        timeout-minutes: 10

      - name: Upload build artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}-node${{ matrix.node-version }}
          path: |
            cli.mjs
            dist/
            web/dist/
            ipfs_accelerate_js/dist/
            build-output.log
          if-no-files-found: warn
          retention-days: 7

      - name: Create build summary
        if: always()
        run: |
          echo "# Build Summary for ${{ matrix.platform }}" > build-summary-${{ matrix.arch }}.md
          echo "" >> build-summary-${{ matrix.arch }}.md
          echo "**Platform**: ${{ matrix.platform }}" >> build-summary-${{ matrix.arch }}.md
          echo "**OS**: ${{ matrix.os }}" >> build-summary-${{ matrix.arch }}.md
          echo "**Architecture**: ${{ matrix.arch }}" >> build-summary-${{ matrix.arch }}.md
          echo "**Node Version**: ${{ matrix.node-version }}" >> build-summary-${{ matrix.arch }}.md
          echo "**Build Status**: ${{ steps.build.outputs.build_status || 'unknown' }}" >> build-summary-${{ matrix.arch }}.md
          echo "" >> build-summary-${{ matrix.arch }}.md
          
          if [ -f "cli.mjs" ]; then
            cli_size=$(stat -c%s "cli.mjs" 2>/dev/null || stat -f%z "cli.mjs")
            echo "**CLI Size**: ${cli_size} bytes" >> build-summary-${{ matrix.arch }}.md
          fi
          
          cat build-summary-${{ matrix.arch }}.md

      - name: Upload build summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-summary-${{ matrix.os }}-${{ matrix.arch }}-node${{ matrix.node-version }}
          path: build-summary-${{ matrix.arch }}.md
          if-no-files-found: ignore

  # Build Docker images for multiple platforms
  docker-multiarch:
    name: Docker Multi-Architecture Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-architecture Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build-tools/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=20.19.0

      - name: Docker build summary
        run: |
          echo "# Docker Multi-Architecture Build Summary" > docker-summary.md
          echo "" >> docker-summary.md
          echo "**Platforms Built**: linux/amd64, linux/arm64" >> docker-summary.md
          echo "**Registry**: ${{ env.REGISTRY }}" >> docker-summary.md
          echo "**Image**: ${{ env.IMAGE_NAME }}" >> docker-summary.md
          echo "" >> docker-summary.md
          echo "## Tags" >> docker-summary.md
          echo '${{ steps.meta.outputs.tags }}' | while read tag; do
            echo "- \`$tag\`" >> docker-summary.md
          done
          cat docker-summary.md

      - name: Upload Docker summary
        uses: actions/upload-artifact@v4
        with:
          name: docker-multiarch-summary
          path: docker-summary.md

  # Package binaries for release
  package-binaries:
    name: Package Release Binaries
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create release packages
        run: |
          mkdir -p release-packages
          
          # Package x86_64 builds
          if [ -d "artifacts/build-ubuntu-latest-x86_64-node20.19.0" ]; then
            cd artifacts/build-ubuntu-latest-x86_64-node20.19.0
            tar -czf ../../release-packages/swissknife-linux-x86_64.tar.gz cli.mjs dist/ 2>/dev/null || true
            cd ../..
          fi
          
          # Package ARM64 builds
          if [ -d "artifacts/build-ubuntu-latest-arm64-node20.19.0" ]; then
            cd artifacts/build-ubuntu-latest-arm64-node20.19.0
            tar -czf ../../release-packages/swissknife-linux-arm64.tar.gz cli.mjs dist/ 2>/dev/null || true
            cd ../..
          fi
          
          # Package macOS x86_64 builds
          if [ -d "artifacts/build-macos-13-x86_64-node20.19.0" ]; then
            cd artifacts/build-macos-13-x86_64-node20.19.0
            tar -czf ../../release-packages/swissknife-macos-x86_64.tar.gz cli.mjs dist/ 2>/dev/null || true
            cd ../..
          fi
          
          # Package macOS ARM64 builds
          if [ -d "artifacts/build-macos-14-arm64-node20.19.0" ]; then
            cd artifacts/build-macos-14-arm64-node20.19.0
            tar -czf ../../release-packages/swissknife-macos-arm64.tar.gz cli.mjs dist/ 2>/dev/null || true
            cd ../..
          fi
          
          echo "✅ Created release packages:"
          ls -lh release-packages/

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-packages/
          if-no-files-found: warn

  # Final summary job
  build-summary:
    name: Multi-Architecture Build Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-multiarch]
    permissions:
      contents: read
    if: always()
    
    steps:
      - name: Generate comprehensive summary
        run: |
          echo "# SwissKnife Multi-Architecture Build Report" > final-summary.md
          echo "" >> final-summary.md
          echo "**Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> final-summary.md
          echo "**Commit**: ${{ github.sha }}" >> final-summary.md
          echo "**Branch**: ${{ github.ref_name }}" >> final-summary.md
          echo "" >> final-summary.md
          
          echo "## Build Matrix Results" >> final-summary.md
          echo "" >> final-summary.md
          
          if [ "${{ needs.build-and-test.result }}" = "success" ]; then
            echo "✅ **Build & Test**: All platforms passed" >> final-summary.md
          else
            echo "❌ **Build & Test**: Some platforms failed" >> final-summary.md
          fi
          
          if [ "${{ needs.docker-multiarch.result }}" = "success" ]; then
            echo "✅ **Docker Multi-Arch**: Built successfully" >> final-summary.md
          elif [ "${{ needs.docker-multiarch.result }}" = "skipped" ]; then
            echo "⏭️ **Docker Multi-Arch**: Skipped" >> final-summary.md
          else
            echo "❌ **Docker Multi-Arch**: Failed" >> final-summary.md
          fi
          
          echo "" >> final-summary.md
          echo "## Supported Platforms" >> final-summary.md
          echo "- ✅ Linux x86_64 (AMD64)" >> final-summary.md
          echo "- ✅ Linux ARM64 (aarch64)" >> final-summary.md
          echo "- ✅ macOS x86_64 (Intel)" >> final-summary.md
          echo "- ✅ macOS ARM64 (Apple Silicon)" >> final-summary.md
          echo "" >> final-summary.md
          echo "## Node.js Versions Tested" >> final-summary.md
          echo "- Node.js 20.19.0" >> final-summary.md
          echo "- Node.js 22.12.0" >> final-summary.md
          
          cat final-summary.md

      - name: Upload final summary
        uses: actions/upload-artifact@v4
        with:
          name: multi-arch-build-summary
          path: final-summary.md
