name: Release Readiness Gates

# SWR-044: phase-11 browser hardening release readiness.
# The workflow intentionally runs the same command as local release validation:
# `npm run release:readiness`.

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: {}

env:
  NODE_ENV: test
  CI: 'true'

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: SWR-044 browser hardening readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Verify browser-validation toolchain
        run: node scripts/verify-browser-toolchain.mjs --receipt "${{ runner.temp }}/swissknife-browser-toolchain-release-readiness.json"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: Run release readiness
        run: npm run release:readiness

      - name: Upload release readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-evidence
          path: |
            docs/release-readiness-report.json
            docs/release-readiness-report.md
            docs/release-evidence-freshness.json
            docs/release-evidence-freshness.md
            docs/browser-bundle-budget.json
            docs/browser-bundle-budget.md
            docs/browser-libp2p-evidence.md
            test-results/browser-smoke-matrix/*.json
            test-results/browser-smoke-matrix/screenshots/*.png
          if-no-files-found: ignore
