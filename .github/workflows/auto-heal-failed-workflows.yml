name: Auto-Heal Failed Workflows

on:
  workflow_run:
    workflows:
      - "SwissKnife CD (Deployment)"
      - "SwissKnife CI - Robust"
      - "SwissKnife CI"
      - "SwissKnife Docker Integration CI"
      - "📚 SwissKnife Documentation Automation for Users & Agents"
      - "Multi-Architecture Build"
      - "Build and Publish"
      - "Production Deployment"
      - "Release Management"
      - "Self-Hosted ARM64 Build"
      - "SonarQube Analysis"
      - "Version Bump"
      - "Test Auto-Heal System (Example)"
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

jobs:
  check-failure:
    name: Check for Workflow Failure
    runs-on: ubuntu-latest
    # Only run if the workflow failed
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    outputs:
      should_create_pr: ${{ steps.check.outputs.should_create_pr }}
      workflow_name: ${{ steps.check.outputs.workflow_name }}
      workflow_id: ${{ steps.check.outputs.workflow_id }}
      run_id: ${{ steps.check.outputs.run_id }}
      branch_name: ${{ steps.check.outputs.branch_name }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if auto-heal should be triggered
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Use environment variables to prevent code injection
          echo "Workflow '${WORKFLOW_NAME}' failed"
          echo "Run ID: ${RUN_ID}"
          echo "Branch: ${HEAD_BRANCH}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          
          # Don't create auto-heal PRs for the auto-heal workflow itself (prevent loops)
          if [[ "${WORKFLOW_NAME}" == "Auto-Heal Failed Workflows" ]]; then
            echo "Skipping auto-heal for auto-heal workflow to prevent loops"
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Don't create auto-heal PRs if this is already an auto-heal branch
          if [[ "${HEAD_BRANCH}" == auto-heal/* ]]; then
            echo "Skipping auto-heal for auto-heal branch to prevent loops"
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Search for existing auto-heal PRs (sanitize workflow name for search)
          # Use jq to safely handle the workflow name
          existing_prs=$(gh pr list --state open --label auto-heal --json number,title | jq --arg wname "${WORKFLOW_NAME}" '[.[] | select(.title | contains($wname))] | length')
          
          if [ "$existing_prs" -gt 0 ]; then
            echo "Auto-heal PR already exists for this workflow, skipping"
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "should_create_pr=true" >> $GITHUB_OUTPUT
          # Store sanitized values in outputs - these will be used in subsequent steps
          echo "workflow_name=${WORKFLOW_NAME}" >> $GITHUB_OUTPUT
          echo "workflow_id=${WORKFLOW_ID}" >> $GITHUB_OUTPUT
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "branch_name=${HEAD_BRANCH}" >> $GITHUB_OUTPUT

  analyze-failure:
    name: Analyze Failure and Create Auto-Heal PR
    runs-on: ubuntu-latest
    needs: check-failure
    if: needs.check-failure.outputs.should_create_pr == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Always checkout from the base repository (github.repository)
          # Never checkout from workflow_run branch as it could be from a fork
          # This prevents untrusted code execution
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify browser-validation toolchain
        run: node scripts/verify-browser-toolchain.mjs --receipt "${{ runner.temp }}/swissknife-browser-toolchain-auto-heal.json"
      
      - name: Install GitHub CLI
        run: |
          type -p gh >/dev/null || {
            sudo mkdir -p -m 755 /etc/apt/keyrings
            wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          }
          gh --version
      
      - name: Get workflow failure details
        id: failure-details
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
          WORKFLOW_NAME: ${{ needs.check-failure.outputs.workflow_name }}
          BRANCH_NAME: ${{ needs.check-failure.outputs.branch_name }}
        run: |
          echo "Fetching failure details for run ID: ${RUN_ID}"
          
          # Create analysis directory
          mkdir -p /tmp/failure-analysis
          
          # Get workflow run details - use environment variable instead of direct substitution
          gh run view "${RUN_ID}" --json jobs,conclusion,createdAt,headBranch > /tmp/failure-analysis/run-details.json
          
          # Get failed jobs
          gh run view "${RUN_ID}" --json jobs --jq '.jobs[] | select(.conclusion == "failure")' > /tmp/failure-analysis/failed-jobs.json
          
          # Download logs for failed jobs (limit to first 3 failed jobs to avoid overwhelming)
          failed_job_count=$(cat /tmp/failure-analysis/failed-jobs.json | jq -s 'length')
          echo "Found $failed_job_count failed job(s)"
          
          # Get logs from failed jobs
          cat /tmp/failure-analysis/failed-jobs.json | jq -s -r '.[:3][] | .databaseId' | while read -r job_id; do
            echo "Downloading logs for job $job_id"
            gh run view --job="$job_id" --log > /tmp/failure-analysis/job-"${job_id}"-log.txt 2>&1 || echo "Failed to get logs for job $job_id"
          done
          
          # Create failure summary using environment variables to prevent injection
          cat > /tmp/failure-analysis/summary.md << EOF
          # Workflow Failure Analysis
          
          ## Failed Workflow Information
          - **Workflow Name**: ${WORKFLOW_NAME}
          - **Run ID**: ${RUN_ID}
          - **Branch**: ${BRANCH_NAME}
          - **Conclusion**: failure
          
          ## Failed Jobs
          EOF
          
          cat /tmp/failure-analysis/failed-jobs.json | jq -s -r '.[] | "- **\(.name)**: \(.conclusion) (Steps: \(.steps | length))"' >> /tmp/failure-analysis/summary.md
          
          cat >> /tmp/failure-analysis/summary.md << 'EOF'
          
          ## Failure Analysis
          
          Please review the logs above to identify the root cause of the failure.
          Common issues include:
          - Build/compilation errors
          - Test failures
          - Linting/formatting issues
          - Dependency problems
          - Configuration errors
          EOF
          
          cat /tmp/failure-analysis/summary.md
          
          # Store summary path as output instead of content in GITHUB_ENV
          echo "summary_file=/tmp/failure-analysis/summary.md" >> $GITHUB_OUTPUT
      
      - name: Extract error messages from logs
        id: extract-errors
        run: |
          echo "Extracting error messages from logs..."
          
          # Create error extraction file
          cat > /tmp/failure-analysis/errors.txt << 'EOF'
          # Extracted Errors from Failed Jobs
          
          EOF
          
          # Extract errors from log files
          for logfile in /tmp/failure-analysis/job-*-log.txt; do
            if [ -f "$logfile" ]; then
              echo "## Errors from $(basename "$logfile")" >> /tmp/failure-analysis/errors.txt
              echo "" >> /tmp/failure-analysis/errors.txt
              
              # Extract lines containing common error patterns
              # Limit output to prevent log bloat
              grep -E "Error:|ERROR:|Failed|FAILED|fatal:|Exception|npm ERR!" "$logfile" | head -50 >> /tmp/failure-analysis/errors.txt || echo "No errors found in this log" >> /tmp/failure-analysis/errors.txt
              
              echo "" >> /tmp/failure-analysis/errors.txt
              echo "---" >> /tmp/failure-analysis/errors.txt
              echo "" >> /tmp/failure-analysis/errors.txt
            fi
          done
          
          cat /tmp/failure-analysis/errors.txt
          
          # Store error file path as output instead of content in GITHUB_ENV
          echo "errors_file=/tmp/failure-analysis/errors.txt" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Issue with Failure Logs
        id: create-issue
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ needs.check-failure.outputs.workflow_name }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
          BRANCH_NAME: ${{ needs.check-failure.outputs.branch_name }}
        run: |
          # Generate timestamp and slug
          timestamp=$(date +%Y%m%d-%H%M%S)
          workflow_slug=$(echo "${WORKFLOW_NAME}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-')
          
          # Read failure summary and errors from files
          FAILURE_SUMMARY=$(cat /tmp/failure-analysis/summary.md)
          ERROR_DETAILS=$(cat /tmp/failure-analysis/errors.txt)
          
          # Create issue body with complete failure information
          cat > /tmp/issue-body.md << EOF
          ## ⚠️ Workflow Failure Alert
          
          **Failed Workflow**: ${WORKFLOW_NAME}  
          **Run ID**: [${RUN_ID}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID})  
          **Branch**: ${BRANCH_NAME}  
          **Failed At**: ${{ github.event.workflow_run.updated_at }}
          
          ---
          
          ${FAILURE_SUMMARY}
          
          ---
          
          ## 🔍 Error Details from Logs
          
          ${ERROR_DETAILS}
          
          ---
          
          ## 🤖 Auto-Heal Status
          
          A draft PR will be automatically created to fix this issue, with @github-copilot invoked to implement the fix.
          
          **What's happening:**
          1. ✅ This issue created with failure logs
          2. 🔄 Draft PR being created (will reference this issue)
          3. 🤖 @github-copilot will be invoked on the PR
          4. ⏳ Monitor the PR for Copilot's response
          
          **Links:**
          - [View Failed Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID})
          - [Workflow File](/${{ github.repository }}/blob/main/.github/workflows/${WORKFLOW_NAME}.yml)
          
          This issue will be automatically closed when the auto-heal PR is merged.
          EOF
          
          # Create the issue
          issue_url=$(gh issue create \
            --title "🚨 Workflow Failure: ${WORKFLOW_NAME}" \
            --body-file /tmp/issue-body.md \
            --label "workflow-failure,auto-heal,needs-fix")
          
          echo "Created issue: $issue_url"
          echo "issue_url=$issue_url" >> $GITHUB_OUTPUT
          
          # Extract issue number from URL
          issue_number=$(echo "$issue_url" | grep -oP '\d+$')
          echo "issue_number=$issue_number" >> $GITHUB_OUTPUT
          echo "workflow_slug=$workflow_slug" >> $GITHUB_OUTPUT
          echo "timestamp=$timestamp" >> $GITHUB_OUTPUT
      
      - name: Create auto-heal branch
        id: create-branch
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ needs.check-failure.outputs.workflow_name }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
          BRANCH_NAME: ${{ needs.check-failure.outputs.branch_name }}
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          # Use timestamp and slug from previous step
          workflow_slug="${{ steps.create-issue.outputs.workflow_slug }}"
          timestamp="${{ steps.create-issue.outputs.timestamp }}"
          branch_name="auto-heal/${workflow_slug}-${timestamp}"
          
          echo "Creating branch: $branch_name"
          
          # Create and push new branch
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git checkout -b "$branch_name"
          
          # Create a simple .gitkeep file to initialize the branch
          mkdir -p .github/auto-heal
          echo "# Auto-heal branch for issue #${ISSUE_NUMBER}" > .github/auto-heal/.gitkeep
          
          git add .github/auto-heal/
          git commit -m "Auto-heal: Initialize branch for ${WORKFLOW_NAME} (fixes #${ISSUE_NUMBER})"
          git push -u origin "$branch_name"
          
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
      
      - name: Create Draft Pull Request and Invoke Copilot
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ needs.check-failure.outputs.workflow_name }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          ISSUE_URL: ${{ steps.create-issue.outputs.issue_url }}
        run: |
          branch_name="${{ steps.create-branch.outputs.branch_name }}"
          
          # Create simple PR body that references the issue and invokes Copilot
          cat > /tmp/pr-body.md << EOF
          Fixes #${ISSUE_NUMBER}

          ## 🤖 @github-copilot please fix this workflow failure

          This draft PR was automatically created to fix the **${WORKFLOW_NAME}** workflow failure.

          **All the details are in issue #${ISSUE_NUMBER}**, including:
          - Complete failure logs
          - Error analysis
          - Links to the failed run

          ### 🎯 Task for GitHub Copilot

          Please review the failure details in issue #${ISSUE_NUMBER} and:

          1. **Analyze** the error logs and identify the root cause
          2. **Review** the workflow file: \`.github/workflows/${WORKFLOW_NAME}.yml\`
          3. **Implement** minimal, surgical changes to fix the issue
          4. **Ensure** the fix doesn't break other workflows
          5. **Test** that your changes resolve the failure

          ### 📋 Guidelines

          - ✅ Make minimal changes only
          - ✅ Focus on the specific failure
          - ✅ Maintain code style and conventions
          - ❌ Don't refactor unrelated code
          - ❌ Don't modify working workflows

          ### 📊 Resources

          - **Issue with full details**: ${ISSUE_URL}
          - **Failed Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}
          - **Workflow File**: \`.github/workflows/${WORKFLOW_NAME}.yml\`

          ---

          *Auto-generated by the Auto-Heal workflow system. This is a draft PR with @github-copilot invoked.*
          EOF
          
          # Create the PR as a DRAFT with @github-copilot in the description
          # Use the default branch as base (not the failed workflow's branch)
          # Creating as draft allows GitHub Copilot to be invoked on it
          default_branch="${{ github.event.repository.default_branch }}"
          pr_url=$(gh pr create \
            --title "🤖 Auto-heal: Fix ${WORKFLOW_NAME} workflow failure" \
            --body-file /tmp/pr-body.md \
            --base "$default_branch" \
            --head "$branch_name" \
            --draft \
            --label "auto-heal,workflow-failure,automated")
          
          echo "Created PR: $pr_url"
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT
          
          # Extract PR number from URL
          pr_number=$(echo "$pr_url" | grep -oP '\d+$')
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
          
          # Update the issue with the PR link
          gh issue comment "${ISSUE_NUMBER}" --body "✅ Draft PR created: ${pr_url}

          @github-copilot has been invoked in the PR to automatically implement the fix.
          
          Monitor the PR for Copilot's response and proposed changes."
      
      
      - name: Summary
        if: always()
        env:
          BRANCH_NAME: ${{ steps.create-branch.outputs.branch_name }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
          ISSUE_URL: ${{ steps.create-issue.outputs.issue_url }}
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
        run: |
          echo "## Auto-Heal Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Auto-heal process completed successfully**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Created Resources" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Issue**: #${ISSUE_NUMBER} - ${ISSUE_URL}" >> $GITHUB_STEP_SUMMARY
          echo "   - Contains complete failure logs and error analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. **Draft PR**: #${PR_NUMBER} - ${PR_URL}" >> $GITHUB_STEP_SUMMARY
          echo "   - References issue #${ISSUE_NUMBER}" >> $GITHUB_STEP_SUMMARY
          echo "   - @github-copilot invoked in PR description" >> $GITHUB_STEP_SUMMARY
          echo "   - Branch: \`${BRANCH_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What happens next?" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. 🤖 **GitHub Copilot invoked** - Copilot was @mentioned in the PR" >> $GITHUB_STEP_SUMMARY
          echo "2. 👀 **Monitor the PR** - Check if Copilot responds and implements fixes" >> $GITHUB_STEP_SUMMARY
          echo "3. 🔧 **Manual if needed** - If Copilot doesn't respond, open in Copilot Workspace or fix manually" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ **Mark ready & merge** - Once fixed and checks pass" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources" >> $GITHUB_STEP_SUMMARY
          echo "- **Issue with logs**: ${ISSUE_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- **Draft PR**: ${PR_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed Run**: [${RUN_ID}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID})" >> $GITHUB_STEP_SUMMARY
