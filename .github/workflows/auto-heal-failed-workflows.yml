name: Auto-Heal Failed Workflows

on:
  workflow_run:
    workflows: ["*"]  # Monitor all workflows
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

jobs:
  check-failure:
    name: Check for Workflow Failure
    runs-on: ubuntu-latest
    # Only run if the workflow failed
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    outputs:
      should_create_pr: ${{ steps.check.outputs.should_create_pr }}
      workflow_name: ${{ steps.check.outputs.workflow_name }}
      workflow_id: ${{ steps.check.outputs.workflow_id }}
      run_id: ${{ steps.check.outputs.run_id }}
      branch_name: ${{ steps.check.outputs.branch_name }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if auto-heal should be triggered
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Workflow '${{ github.event.workflow_run.name }}' failed"
          echo "Run ID: ${{ github.event.workflow_run.id }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          
          # Don't create auto-heal PRs for the auto-heal workflow itself (prevent loops)
          if [[ "${{ github.event.workflow_run.name }}" == "Auto-Heal Failed Workflows" ]]; then
            echo "Skipping auto-heal for auto-heal workflow to prevent loops"
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Don't create auto-heal PRs if this is already an auto-heal branch
          if [[ "${{ github.event.workflow_run.head_branch }}" == auto-heal/* ]]; then
            echo "Skipping auto-heal for auto-heal branch to prevent loops"
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if an auto-heal PR already exists for this workflow
          workflow_name="${{ github.event.workflow_run.name }}"
          branch_name="${{ github.event.workflow_run.head_branch }}"
          
          # Search for existing auto-heal PRs
          existing_prs=$(gh pr list --state open --search "Auto-heal: $workflow_name" --json number,title --jq 'length')
          
          if [ "$existing_prs" -gt 0 ]; then
            echo "Auto-heal PR already exists for this workflow, skipping"
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "should_create_pr=true" >> $GITHUB_OUTPUT
          echo "workflow_name=$workflow_name" >> $GITHUB_OUTPUT
          echo "workflow_id=${{ github.event.workflow_run.workflow_id }}" >> $GITHUB_OUTPUT
          echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT

  analyze-failure:
    name: Analyze Failure and Create Auto-Heal PR
    runs-on: ubuntu-latest
    needs: check-failure
    if: needs.check-failure.outputs.should_create_pr == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-failure.outputs.branch_name }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install GitHub CLI
        run: |
          type -p gh >/dev/null || {
            sudo mkdir -p -m 755 /etc/apt/keyrings
            wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          }
          gh --version
      
      - name: Get workflow failure details
        id: failure-details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fetching failure details for run ID: ${{ needs.check-failure.outputs.run_id }}"
          
          # Create analysis directory
          mkdir -p /tmp/failure-analysis
          
          # Get workflow run details
          gh run view ${{ needs.check-failure.outputs.run_id }} --json jobs,conclusion,createdAt,headBranch > /tmp/failure-analysis/run-details.json
          
          # Get failed jobs
          gh run view ${{ needs.check-failure.outputs.run_id }} --json jobs --jq '.jobs[] | select(.conclusion == "failure")' > /tmp/failure-analysis/failed-jobs.json
          
          # Download logs for failed jobs (limit to first 3 failed jobs to avoid overwhelming)
          failed_job_count=$(cat /tmp/failure-analysis/failed-jobs.json | jq -s 'length')
          echo "Found $failed_job_count failed job(s)"
          
          # Get logs from failed jobs
          cat /tmp/failure-analysis/failed-jobs.json | jq -s -r '.[:3][] | .databaseId' | while read job_id; do
            echo "Downloading logs for job $job_id"
            gh run view --job=$job_id --log > /tmp/failure-analysis/job-${job_id}-log.txt 2>&1 || echo "Failed to get logs for job $job_id"
          done
          
          # Create failure summary
          cat > /tmp/failure-analysis/summary.md << 'EOF'
          # Workflow Failure Analysis
          
          ## Failed Workflow Information
          - **Workflow Name**: ${{ needs.check-failure.outputs.workflow_name }}
          - **Run ID**: ${{ needs.check-failure.outputs.run_id }}
          - **Branch**: ${{ needs.check-failure.outputs.branch_name }}
          - **Conclusion**: failure
          
          ## Failed Jobs
          EOF
          
          cat /tmp/failure-analysis/failed-jobs.json | jq -s -r '.[] | "- **\(.name)**: \(.conclusion) (Steps: \(.steps | length))"' >> /tmp/failure-analysis/summary.md
          
          echo "" >> /tmp/failure-analysis/summary.md
          echo "## Failure Analysis" >> /tmp/failure-analysis/summary.md
          echo "" >> /tmp/failure-analysis/summary.md
          echo "Please review the logs above to identify the root cause of the failure." >> /tmp/failure-analysis/summary.md
          echo "Common issues include:" >> /tmp/failure-analysis/summary.md
          echo "- Build/compilation errors" >> /tmp/failure-analysis/summary.md
          echo "- Test failures" >> /tmp/failure-analysis/summary.md
          echo "- Linting/formatting issues" >> /tmp/failure-analysis/summary.md
          echo "- Dependency problems" >> /tmp/failure-analysis/summary.md
          echo "- Configuration errors" >> /tmp/failure-analysis/summary.md
          
          cat /tmp/failure-analysis/summary.md
          
          # Store analysis for next step
          echo "FAILURE_SUMMARY<<EOF" >> $GITHUB_ENV
          cat /tmp/failure-analysis/summary.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - name: Extract error messages from logs
        id: extract-errors
        run: |
          echo "Extracting error messages from logs..."
          
          # Create error extraction file
          cat > /tmp/failure-analysis/errors.txt << 'EOF'
          # Extracted Errors from Failed Jobs
          
          EOF
          
          # Extract errors from log files
          for logfile in /tmp/failure-analysis/job-*-log.txt; do
            if [ -f "$logfile" ]; then
              echo "## Errors from $(basename $logfile)" >> /tmp/failure-analysis/errors.txt
              echo "" >> /tmp/failure-analysis/errors.txt
              
              # Extract lines containing common error patterns
              grep -E "Error:|ERROR:|Failed|FAILED|fatal:|Exception|npm ERR!" "$logfile" | head -50 >> /tmp/failure-analysis/errors.txt || echo "No errors found in this log" >> /tmp/failure-analysis/errors.txt
              
              echo "" >> /tmp/failure-analysis/errors.txt
              echo "---" >> /tmp/failure-analysis/errors.txt
              echo "" >> /tmp/failure-analysis/errors.txt
            fi
          done
          
          cat /tmp/failure-analysis/errors.txt
          
          # Store errors for PR description
          echo "ERROR_DETAILS<<EOF" >> $GITHUB_ENV
          cat /tmp/failure-analysis/errors.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - name: Create auto-heal branch
        id: create-branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Generate unique branch name
          timestamp=$(date +%Y%m%d-%H%M%S)
          workflow_slug=$(echo "${{ needs.check-failure.outputs.workflow_name }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-')
          branch_name="auto-heal/${workflow_slug}-${timestamp}"
          
          echo "Creating branch: $branch_name"
          
          # Create and push new branch
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git checkout -b "$branch_name"
          
          # Create a placeholder file to track this auto-heal attempt
          mkdir -p .github/auto-heal-tracking
          cat > ".github/auto-heal-tracking/${workflow_slug}-${timestamp}.md" << EOF
          # Auto-Heal Tracking
          
          - **Workflow**: ${{ needs.check-failure.outputs.workflow_name }}
          - **Failed Run ID**: ${{ needs.check-failure.outputs.run_id }}
          - **Source Branch**: ${{ needs.check-failure.outputs.branch_name }}
          - **Created**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Auto-Heal Branch**: ${branch_name}
          
          ## Instructions for GitHub Copilot Agent
          
          This workflow failure needs to be automatically fixed. Please:
          
          1. Review the workflow file: .github/workflows/${{ needs.check-failure.outputs.workflow_name }}.yml
          2. Analyze the failure logs and error messages provided below
          3. Identify the root cause of the failure
          4. Make minimal, surgical changes to fix the issue
          5. Ensure the fix doesn't break other functionality
          
          ## Failure Summary
          
          ${FAILURE_SUMMARY}
          
          ## Error Details
          
          ${ERROR_DETAILS}
          
          ## Recommended Actions
          
          Based on the failure type, consider:
          - Fixing syntax errors in workflow files
          - Updating dependencies or package versions
          - Fixing test failures
          - Resolving linting/formatting issues
          - Correcting configuration errors
          - Updating deprecated actions or commands
          
          EOF
          
          git add .github/auto-heal-tracking/
          git commit -m "Auto-heal: Track workflow failure for ${{ needs.check-failure.outputs.workflow_name }}"
          git push -u origin "$branch_name"
          
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
      
      - name: Create Pull Request with Copilot Instructions
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_name="${{ steps.create-branch.outputs.branch_name }}"
          
          # Create PR body with instructions for Copilot
          cat > /tmp/pr-body.md << 'EOF'
          # 🤖 Auto-Heal: Fix Failed Workflow
          
          ## Workflow Failure Details
          
          **Failed Workflow**: ${{ needs.check-failure.outputs.workflow_name }}  
          **Run ID**: [${{ needs.check-failure.outputs.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.check-failure.outputs.run_id }})  
          **Source Branch**: ${{ needs.check-failure.outputs.branch_name }}  
          **Failed At**: ${{ github.event.workflow_run.updated_at }}
          
          ---
          
          ## 🎯 Task for GitHub Copilot Agent
          
          This PR has been automatically created to fix the workflow failure. Please review the failure details below and implement the necessary fixes.
          
          ### Instructions:
          
          1. **Analyze the failure logs** provided in the tracking file
          2. **Identify the root cause** of the workflow failure
          3. **Implement minimal fixes** to resolve the issue
          4. **Test your changes** to ensure they work correctly
          5. **Avoid breaking changes** to existing functionality
          
          ### Failure Information
          
          ${FAILURE_SUMMARY}
          
          ---
          
          ## 🔍 Extracted Error Messages
          
          ${ERROR_DETAILS}
          
          ---
          
          ## 📋 Checklist for Fixing
          
          - [ ] Identify root cause from error logs
          - [ ] Review relevant workflow file: `.github/workflows/${{ needs.check-failure.outputs.workflow_name }}.yml`
          - [ ] Implement fix with minimal changes
          - [ ] Verify fix doesn't break other workflows
          - [ ] Update documentation if needed
          - [ ] Test the fix locally or in CI
          
          ---
          
          ## 🤖 Auto-Heal System
          
          This PR was created automatically by the Auto-Heal workflow system when the "${{ needs.check-failure.outputs.workflow_name }}" workflow failed.
          
          **To fix this issue:**
          - A GitHub Copilot agent can automatically implement the fixes based on the error analysis above
          - Alternatively, you can manually review and fix the issues
          - Once fixed, this PR can be merged to resolve the workflow failure
          
          **Related Links:**
          - [Failed Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.check-failure.outputs.run_id }})
          - [Workflow File](/.github/workflows/${{ needs.check-failure.outputs.workflow_name }}.yml)
          
          ---
          
          *This is an automated PR created by the Auto-Heal workflow system.*
          EOF
          
          # Create the PR
          pr_url=$(gh pr create \
            --title "🤖 Auto-heal: Fix ${{ needs.check-failure.outputs.workflow_name }} workflow failure" \
            --body-file /tmp/pr-body.md \
            --base "${{ needs.check-failure.outputs.branch_name }}" \
            --head "$branch_name" \
            --label "auto-heal,workflow-failure,automated")
          
          echo "Created PR: $pr_url"
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT
          
          # Extract PR number from URL
          pr_number=$(echo "$pr_url" | grep -oP '\d+$')
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
      
      - name: Add Copilot Agent Instructions as Comment
        if: steps.create-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Add a comment with specific instructions for the Copilot agent
          gh pr comment ${{ steps.create-pr.outputs.pr_number }} --body "## 🤖 GitHub Copilot Agent Instructions

          @github-copilot Please analyze this workflow failure and implement the necessary fixes.

          ### Analysis Required:
          1. Review the workflow file: \`.github/workflows/${{ needs.check-failure.outputs.workflow_name }}.yml\`
          2. Examine the error logs in the tracking file: \`.github/auto-heal-tracking/\`
          3. Identify the root cause of the failure

          ### Fixing Guidelines:
          - Make minimal, surgical changes only
          - Focus on fixing the specific failure
          - Don't refactor unrelated code
          - Maintain existing code style and conventions
          - Add comments explaining fixes if needed

          ### Testing:
          - Ensure fixes resolve the workflow failure
          - Verify no other workflows are broken
          - Check that all tests pass

          Please proceed with the analysis and fixes. Thank you! 🚀"
      
      - name: Create GitHub Issue for Manual Review
        if: steps.create-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create an issue to track this auto-heal attempt
          gh issue create \
            --title "⚠️ Workflow Failure: ${{ needs.check-failure.outputs.workflow_name }} requires attention" \
            --body "## Workflow Failure Alert

          A workflow has failed and an auto-heal PR has been created.

          **Failed Workflow**: ${{ needs.check-failure.outputs.workflow_name }}  
          **Run ID**: [${{ needs.check-failure.outputs.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.check-failure.outputs.run_id }})  
          **Auto-Heal PR**: ${{ steps.create-pr.outputs.pr_url }}  

          ### Next Steps:
          1. Review the auto-heal PR: ${{ steps.create-pr.outputs.pr_url }}
          2. A GitHub Copilot agent can implement fixes automatically
          3. Or manually review and fix the issues
          4. Merge the PR once fixes are verified

          This issue will be automatically closed when the PR is merged." \
            --label "workflow-failure,auto-heal,needs-review" || echo "Issue creation failed or already exists"
      
      - name: Summary
        if: always()
        run: |
          echo "## Auto-Heal Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Auto-heal PR created successfully**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ steps.create-branch.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: ${{ steps.create-pr.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Number**: #${{ steps.create-pr.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What happens next?" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. 🤖 A GitHub Copilot agent can be invoked on the PR to automatically implement fixes" >> $GITHUB_STEP_SUMMARY
          echo "2. 👨‍💻 Or you can manually review and fix the issues" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Once fixed and tested, merge the PR to resolve the workflow failure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Failed Workflow Run**: [${{ needs.check-failure.outputs.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.check-failure.outputs.run_id }})" >> $GITHUB_STEP_SUMMARY
