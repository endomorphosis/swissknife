name: Auto-Heal Failed Workflows

on:
  workflow_run:
    workflows:
      - "SwissKnife CD (Deployment)"
      - "SwissKnife CI - Robust"
      - "SwissKnife CI"
      - "SwissKnife Docker Integration CI"
      - "📚 SwissKnife Documentation Automation for Users & Agents"
      - "Multi-Architecture Build"
      - "Build and Publish"
      - "Production Deployment"
      - "Release Management"
      - "Self-Hosted ARM64 Build"
      - "SonarQube Analysis"
      - "Version Bump"
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

jobs:
  check-failure:
    name: Check for Workflow Failure
    runs-on: ubuntu-latest
    # Only run if the workflow failed
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    outputs:
      should_create_pr: ${{ steps.check.outputs.should_create_pr }}
      workflow_name: ${{ steps.check.outputs.workflow_name }}
      workflow_id: ${{ steps.check.outputs.workflow_id }}
      run_id: ${{ steps.check.outputs.run_id }}
      branch_name: ${{ steps.check.outputs.branch_name }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if auto-heal should be triggered
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Use environment variables to prevent code injection
          echo "Workflow '${WORKFLOW_NAME}' failed"
          echo "Run ID: ${RUN_ID}"
          echo "Branch: ${HEAD_BRANCH}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          
          # Don't create auto-heal PRs for the auto-heal workflow itself (prevent loops)
          if [[ "${WORKFLOW_NAME}" == "Auto-Heal Failed Workflows" ]]; then
            echo "Skipping auto-heal for auto-heal workflow to prevent loops"
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Don't create auto-heal PRs if this is already an auto-heal branch
          if [[ "${HEAD_BRANCH}" == auto-heal/* ]]; then
            echo "Skipping auto-heal for auto-heal branch to prevent loops"
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Search for existing auto-heal PRs (sanitize workflow name for search)
          # Use jq to safely handle the workflow name
          existing_prs=$(gh pr list --state open --label auto-heal --json number,title | jq --arg wname "${WORKFLOW_NAME}" '[.[] | select(.title | contains($wname))] | length')
          
          if [ "$existing_prs" -gt 0 ]; then
            echo "Auto-heal PR already exists for this workflow, skipping"
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "should_create_pr=true" >> $GITHUB_OUTPUT
          # Store sanitized values in outputs - these will be used in subsequent steps
          echo "workflow_name=${WORKFLOW_NAME}" >> $GITHUB_OUTPUT
          echo "workflow_id=${WORKFLOW_ID}" >> $GITHUB_OUTPUT
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "branch_name=${HEAD_BRANCH}" >> $GITHUB_OUTPUT

  analyze-failure:
    name: Analyze Failure and Create Auto-Heal PR
    runs-on: ubuntu-latest
    needs: check-failure
    if: needs.check-failure.outputs.should_create_pr == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Always checkout from the base repository (github.repository)
          # Never checkout from workflow_run branch as it could be from a fork
          # This prevents untrusted code execution
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install GitHub CLI
        run: |
          type -p gh >/dev/null || {
            sudo mkdir -p -m 755 /etc/apt/keyrings
            wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          }
          gh --version
      
      - name: Get workflow failure details
        id: failure-details
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
          WORKFLOW_NAME: ${{ needs.check-failure.outputs.workflow_name }}
          BRANCH_NAME: ${{ needs.check-failure.outputs.branch_name }}
        run: |
          echo "Fetching failure details for run ID: ${RUN_ID}"
          
          # Create analysis directory
          mkdir -p /tmp/failure-analysis
          
          # Get workflow run details - use environment variable instead of direct substitution
          gh run view "${RUN_ID}" --json jobs,conclusion,createdAt,headBranch > /tmp/failure-analysis/run-details.json
          
          # Get failed jobs
          gh run view "${RUN_ID}" --json jobs --jq '.jobs[] | select(.conclusion == "failure")' > /tmp/failure-analysis/failed-jobs.json
          
          # Download logs for failed jobs (limit to first 3 failed jobs to avoid overwhelming)
          failed_job_count=$(cat /tmp/failure-analysis/failed-jobs.json | jq -s 'length')
          echo "Found $failed_job_count failed job(s)"
          
          # Get logs from failed jobs
          cat /tmp/failure-analysis/failed-jobs.json | jq -s -r '.[:3][] | .databaseId' | while read -r job_id; do
            echo "Downloading logs for job $job_id"
            gh run view --job="$job_id" --log > /tmp/failure-analysis/job-"${job_id}"-log.txt 2>&1 || echo "Failed to get logs for job $job_id"
          done
          
          # Create failure summary using environment variables to prevent injection
          cat > /tmp/failure-analysis/summary.md << EOF
          # Workflow Failure Analysis
          
          ## Failed Workflow Information
          - **Workflow Name**: ${WORKFLOW_NAME}
          - **Run ID**: ${RUN_ID}
          - **Branch**: ${BRANCH_NAME}
          - **Conclusion**: failure
          
          ## Failed Jobs
          EOF
          
          cat /tmp/failure-analysis/failed-jobs.json | jq -s -r '.[] | "- **\(.name)**: \(.conclusion) (Steps: \(.steps | length))"' >> /tmp/failure-analysis/summary.md
          
          cat >> /tmp/failure-analysis/summary.md << 'EOF'
          
          ## Failure Analysis
          
          Please review the logs above to identify the root cause of the failure.
          Common issues include:
          - Build/compilation errors
          - Test failures
          - Linting/formatting issues
          - Dependency problems
          - Configuration errors
          EOF
          
          cat /tmp/failure-analysis/summary.md
          
          # Store summary path as output instead of content in GITHUB_ENV
          echo "summary_file=/tmp/failure-analysis/summary.md" >> $GITHUB_OUTPUT
      
      - name: Extract error messages from logs
        id: extract-errors
        run: |
          echo "Extracting error messages from logs..."
          
          # Create error extraction file
          cat > /tmp/failure-analysis/errors.txt << 'EOF'
          # Extracted Errors from Failed Jobs
          
          EOF
          
          # Extract errors from log files
          for logfile in /tmp/failure-analysis/job-*-log.txt; do
            if [ -f "$logfile" ]; then
              echo "## Errors from $(basename "$logfile")" >> /tmp/failure-analysis/errors.txt
              echo "" >> /tmp/failure-analysis/errors.txt
              
              # Extract lines containing common error patterns
              # Limit output to prevent log bloat
              grep -E "Error:|ERROR:|Failed|FAILED|fatal:|Exception|npm ERR!" "$logfile" | head -50 >> /tmp/failure-analysis/errors.txt || echo "No errors found in this log" >> /tmp/failure-analysis/errors.txt
              
              echo "" >> /tmp/failure-analysis/errors.txt
              echo "---" >> /tmp/failure-analysis/errors.txt
              echo "" >> /tmp/failure-analysis/errors.txt
            fi
          done
          
          cat /tmp/failure-analysis/errors.txt
          
          # Store error file path as output instead of content in GITHUB_ENV
          echo "errors_file=/tmp/failure-analysis/errors.txt" >> $GITHUB_OUTPUT
      
      - name: Create auto-heal branch
        id: create-branch
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ needs.check-failure.outputs.workflow_name }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
          BRANCH_NAME: ${{ needs.check-failure.outputs.branch_name }}
        run: |
          # Generate unique branch name - use environment variable to prevent injection
          timestamp=$(date +%Y%m%d-%H%M%S)
          # Sanitize workflow name for use in branch/file names
          workflow_slug=$(echo "${WORKFLOW_NAME}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-')
          branch_name="auto-heal/${workflow_slug}-${timestamp}"
          
          echo "Creating branch: $branch_name"
          
          # Create and push new branch
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git checkout -b "$branch_name"
          
          # Create a placeholder file to track this auto-heal attempt
          mkdir -p .github/auto-heal-tracking
          
          # Read the failure summary and errors from files
          FAILURE_SUMMARY=$(cat /tmp/failure-analysis/summary.md)
          ERROR_DETAILS=$(cat /tmp/failure-analysis/errors.txt)
          
          # Create tracking file with safe content
          cat > ".github/auto-heal-tracking/${workflow_slug}-${timestamp}.md" << EOF
          # Auto-Heal Tracking
          
          - **Workflow**: ${WORKFLOW_NAME}
          - **Failed Run ID**: ${RUN_ID}
          - **Source Branch**: ${BRANCH_NAME}
          - **Created**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Auto-Heal Branch**: ${branch_name}
          
          ## Instructions for GitHub Copilot Agent
          
          This workflow failure needs to be automatically fixed. Please:
          
          1. Review the workflow file: .github/workflows/${WORKFLOW_NAME}.yml
          2. Analyze the failure logs and error messages provided below
          3. Identify the root cause of the failure
          4. Make minimal, surgical changes to fix the issue
          5. Ensure the fix doesn't break other functionality
          
          ## Failure Summary
          
          ${FAILURE_SUMMARY}
          
          ## Error Details
          
          ${ERROR_DETAILS}
          
          ## Recommended Actions
          
          Based on the failure type, consider:
          - Fixing syntax errors in workflow files
          - Updating dependencies or package versions
          - Fixing test failures
          - Resolving linting/formatting issues
          - Correcting configuration errors
          - Updating deprecated actions or commands
          
          EOF
          
          git add .github/auto-heal-tracking/
          git commit -m "Auto-heal: Track workflow failure for ${WORKFLOW_NAME}"
          git push -u origin "$branch_name"
          
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "workflow_slug=$workflow_slug" >> $GITHUB_OUTPUT
      
      - name: Create Pull Request with Copilot Instructions
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ needs.check-failure.outputs.workflow_name }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
          BRANCH_NAME: ${{ needs.check-failure.outputs.branch_name }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          branch_name="${{ steps.create-branch.outputs.branch_name }}"
          
          # Read failure summary and errors from files
          FAILURE_SUMMARY=$(cat /tmp/failure-analysis/summary.md)
          ERROR_DETAILS=$(cat /tmp/failure-analysis/errors.txt)
          
          # Create PR body with instructions for Copilot using environment variables
          cat > /tmp/pr-body.md << EOF
          # 🤖 Auto-Heal: Fix Failed Workflow

          ## Workflow Failure Details

          **Failed Workflow**: ${WORKFLOW_NAME}  
          **Run ID**: [${RUN_ID}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID})  
          **Source Branch**: ${BRANCH_NAME}  
          **Failed At**: ${UPDATED_AT}

          ---

          ## 🎯 GitHub Copilot Agent Task

          **GitHub Copilot has been invoked on this PR** to automatically analyze and fix the workflow failure.

          ### Copilot Instructions:

          1. **Analyze the failure logs** provided in the tracking file under \`.github/auto-heal-tracking/\`
          2. **Identify the root cause** of the workflow failure from the error messages
          3. **Implement minimal fixes** to resolve the issue without breaking existing functionality
          4. **Test your changes** to ensure the workflow will pass
          5. **Document the fix** in your commit messages

          ### Failure Information

          ${FAILURE_SUMMARY}

          ---

          ## 🔍 Extracted Error Messages

          ${ERROR_DETAILS}

          ---

          ## 📋 Fix Checklist

          - [ ] Analyze root cause from error logs
          - [ ] Review workflow file: \`.github/workflows/${WORKFLOW_NAME}.yml\`
          - [ ] Implement fix with minimal changes
          - [ ] Verify fix doesn't break other workflows
          - [ ] Update documentation if needed
          - [ ] Ensure all CI checks pass

          ---

          ## 🤖 Auto-Heal System

          This PR was automatically created by the Auto-Heal workflow system when the "${WORKFLOW_NAME}" workflow failed.

          **Status:**
          - ✅ GitHub Copilot agent has been invoked to fix the issue
          - ⏳ Waiting for Copilot to analyze and implement fixes
          - 🔄 Monitor this PR for updates from Copilot

          **Manual intervention:** If Copilot cannot automatically fix the issue, you can manually review and implement the fixes.

          **Related Links:**
          - [Failed Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID})
          - [Workflow File](/.github/workflows/${WORKFLOW_NAME}.yml)
          - [Tracking File](/.github/auto-heal-tracking/)

          ---

          *This is an automated PR created by the Auto-Heal workflow system with GitHub Copilot integration.*
          EOF
          
          # Create the PR - use environment variable for title to prevent injection
          # Use the default branch as base (not the failed workflow's branch)
          default_branch="${{ github.event.repository.default_branch }}"
          pr_url=$(gh pr create \
            --title "🤖 Auto-heal: Fix ${WORKFLOW_NAME} workflow failure" \
            --body-file /tmp/pr-body.md \
            --base "$default_branch" \
            --head "$branch_name" \
            --label "auto-heal,workflow-failure,automated")
          
          echo "Created PR: $pr_url"
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT
          
          # Extract PR number from URL
          pr_number=$(echo "$pr_url" | grep -oP '\d+$')
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
      
      - name: Add Copilot Agent Instructions as Comment
        if: steps.create-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ needs.check-failure.outputs.workflow_name }}
          WORKFLOW_SLUG: ${{ steps.create-branch.outputs.workflow_slug }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
        run: |
          # Add a comment with specific instructions for the Copilot agent
          gh pr comment "${PR_NUMBER}" --body "@copilot Please analyze this workflow failure and implement the necessary fixes.

          ## 🤖 Task for GitHub Copilot

          This PR was automatically created because the **${WORKFLOW_NAME}** workflow failed. Please:

          ### Analysis Required:
          1. Review the workflow file: \`.github/workflows/${WORKFLOW_NAME}.yml\`
          2. Examine the error logs in the tracking file under \`.github/auto-heal-tracking/\`
          3. Identify the root cause of the failure

          ### Fixing Guidelines:
          - Make minimal, surgical changes only
          - Focus on fixing the specific failure
          - Don't refactor unrelated code
          - Maintain existing code style and conventions
          - Test your changes to ensure they work

          ### Testing:
          - Ensure fixes resolve the workflow failure
          - Verify no other workflows are broken
          - Check that all tests pass

          Please proceed with analyzing the failure logs and implementing the fixes. 🚀"
      
      - name: Create GitHub Issue for Manual Review
        if: steps.create-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ needs.check-failure.outputs.workflow_name }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
        run: |
          # Create an issue to track this auto-heal attempt
          issue_url=$(gh issue create \
            --title "⚠️ Workflow Failure: ${WORKFLOW_NAME} requires attention" \
            --body "## Workflow Failure Alert

          A workflow has failed and an auto-heal PR has been created.

          **Failed Workflow**: ${WORKFLOW_NAME}  
          **Run ID**: [${RUN_ID}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID})  
          **Auto-Heal PR**: ${PR_URL}  

          ### 🤖 GitHub Copilot Integration

          A GitHub Copilot agent has been invoked on PR #${PR_NUMBER} to automatically analyze and fix the issue.

          **To check Copilot's progress:**
          1. Visit the PR: ${PR_URL}
          2. Review Copilot's analysis in the comments
          3. Monitor any commits made by Copilot

          ### Next Steps:
          1. Wait for GitHub Copilot agent to analyze and fix the issue
          2. Review the auto-heal PR: ${PR_URL}
          3. If Copilot cannot fix automatically, manually review and fix the issues
          4. Merge the PR once fixes are verified and all checks pass

          This issue will be automatically closed when the PR is merged." \
            --label "workflow-failure,auto-heal,needs-review,copilot-assisted" || echo "Issue creation failed or already exists")
          
          echo "Created issue: $issue_url"
          echo "issue_url=$issue_url" >> $GITHUB_OUTPUT
      
      - name: Summary
        if: always()
        env:
          BRANCH_NAME: ${{ steps.create-branch.outputs.branch_name }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
        run: |
          echo "## Auto-Heal Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Auto-heal PR created successfully**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${BRANCH_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: ${PR_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Number**: #${PR_NUMBER}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What happens next?" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. 🤖 **GitHub Copilot agent has been invoked** on the PR to automatically analyze and implement fixes" >> $GITHUB_STEP_SUMMARY
          echo "2. 👀 Monitor the PR for Copilot's analysis and commits" >> $GITHUB_STEP_SUMMARY
          echo "3. 👨‍💻 If Copilot cannot fix automatically, you can manually review and fix the issues" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Once fixed and all checks pass, merge the PR to resolve the workflow failure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Failed Workflow Run**: [${RUN_ID}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID})" >> $GITHUB_STEP_SUMMARY
